# ==============================================================================
# CI for astamm.github.io — publish FROM GITHUB ACTIONS (Pages source = Actions)
#
# BASE = the personal site's earlier .github/workflows/publish.yml, which already
# has the right shape:
#   - triggers on the default branch `master` (+ manual dispatch)
#   - sets up Quarto AND R
#   - uses the Posit Package Manager CRAN cache (r-lib setup-r `use-public-rspm`)
#     for fast, binary R package installs
#
# DELTA (this change, 2026-11-02): deploy FROM GITHUB ACTIONS instead of FROM A
# BRANCH. The old finish used quarto-dev/quarto-actions/publish@v2 with
# target: gh-pages, which pushed the built docs/ to the gh-pages branch and relied
# on the repo being configured "Pages > Deploy from a branch: gh-pages".
# Now we use GitHub's standard Pages artifact pipeline:
#     configure-pages -> render -> upload-pages-artifact -> deploy-pages.
# The repo's Pages Source setting MUST be "GitHub Actions"
# (Settings > Pages > Build and deployment > Source > GitHub Actions). The
# gh-pages branch is no longer written; it becomes stale and can be orphaned
# or deleted once the Actions deployment is verified live.
#
# Render-time R deps:
#   gt + janitor were already in the personal list. naniar + skimr were added for
#   RR session 2's executed cells. pins/rdatagouv never execute, so they stay out
#   (rdatagouv is kept only because the personal site's own content may use it).
#
# CI-true: no committed _freeze/ (gitignored); freeze: auto re-renders everything
# on each run. output-dir is docs/, which upload-pages-artifact deploys.
# ==============================================================================

name: Quarto Publish

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libuv1-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev libwebp-dev

      - name: Install R packages
        run: |
           options(repos = "https://packagemanager.posit.co/cran/latest")
           options(
             HTTPUserAgent = sprintf("R/%s R (%s)",
               getRversion(),
               paste(getRversion(), R.version$platform, R.version$arch, R.version$os)
             )
           )
           install.packages(c(
             "dendextend", "fda", "janitor", "kableExtra", "nloptr",
             "palmerpenguins", "patchwork", "remotes", "tidyverse",
             "fdacluster", "squat", "gt", "fiber", "midi", "ripserr",
             "phutil", "TDA", "tidymodels", "tdarec", "inphr",
             "ggfortify", "fdatest", "tdaunif", "bench", "ggbeeswarm",
             "rdatagouv"
           ))
           install.packages(c("naniar", "skimr"))
           remotes::install_github("tractoverse/mascot")
           remotes::install_github("tractoverse/rtists")
           remotes::install_github("tdaverse/ggtda")
        shell: Rscript {0}

      - name: Render Quarto site
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
