# ==============================================================================
# CI for astamm.github.io — publish FROM GITHUB ACTIONS (Pages source = Actions)
#
# BASE = the personal site's earlier .github/workflows/publish.yml, which already
# has the right shape:
#   - triggers on the default branch `master` (+ manual dispatch)
#   - sets up Quarto AND R
#   - uses the Posit Package Manager CRAN cache (r-lib setup-r `use-public-rspm`)
#     for fast, binary R package installs
#
# DELTA (this change, 2026-11-02): deploy FROM GITHUB ACTIONS instead of FROM A
# BRANCH. The old finish used quarto-dev/quarto-actions/publish@v2 with
# target: gh-pages, which pushed the built docs/ to the gh-pages branch and relied
# on the repo being configured "Pages > Deploy from a branch: gh-pages".
# Now we use GitHub's standard Pages artifact pipeline:
#     configure-pages -> render -> upload-pages-artifact -> deploy-pages.
# The repo's Pages Source setting MUST be "GitHub Actions"
# (Settings > Pages > Build and deployment > Source > GitHub Actions). The
# gh-pages branch is no longer written; it becomes stale and can be orphaned
# or deleted once the Actions deployment is verified live.
#
# Render-time R deps:
#   gt + janitor were already in the personal list. naniar + skimr were added for
#   RR session 2's executed cells. pins/rdatagouv never execute, so they stay out
#   (rdatagouv is kept only because the personal site's own content may use it).
#
# CI-true: no committed _freeze/ (gitignored); freeze: auto re-renders everything
# on each run. output-dir is docs/, which upload-pages-artifact deploys.
#
# CACHING (2026-11-03): two actions/cache layers speed up re-deploys without
# breaking CI-true correctness.
#   1. R package library (site-library), keyed on R version + workflow hash, so a
#      cache hit skips the costly source-compiled installs (mascot/rtists/ggtda
#      and the heavy stacks). Editing publish.yml busts the key (package list
#      changes there), as does an R version bump.
#   2. Quarto _freeze/ (executed-cell outputs). A naive content-hash key busted
#      on every real push, so freeze never helped incremental renders. The key is
#      a new github.sha per push (always saves fresh) with a stable `freeze-<os>-`
#      restore-prefix (always restores the previous _freeze/); Quarto's
#      freeze: auto then reuses per-document outputs for unchanged .qmd/.Rmd and
#      re-executes only what changed. _freeze/ stays gitignored, never committed.
# The R cache restore must come AFTER setup-r (needs the r-version output) and
# BEFORE the install step; the _freeze restore sits before the render step.
# ==============================================================================

name: Quarto Publish

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        id: r
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libuv1-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev libwebp-dev

      - name: Cache R package library
        id: cache-r
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/R/site-library
          key: r-packages-${{ runner.os }}-${{ steps.r.outputs.r-version }}-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            r-packages-${{ runner.os }}-${{ steps.r.outputs.r-version }}-

      - name: Install R packages
        run: |
           options(repos = "https://packagemanager.posit.co/cran/latest")
           options(
             HTTPUserAgent = sprintf("R/%s R (%s)",
               getRversion(),
               paste(getRversion(), R.version$platform, R.version$arch, R.version$os)
             )
           )
           install.packages(c(
             "dendextend", "fda", "janitor", "kableExtra", "nloptr",
             "palmerpenguins", "patchwork", "remotes", "tidyverse",
             "fdacluster", "squat", "gt", "fiber", "midi", "ripserr",
             "phutil", "TDA", "tidymodels", "tdarec", "inphr",
             "ggfortify", "fdatest", "tdaunif", "bench", "ggbeeswarm",
             "rdatagouv",
             # data-science-with-r (folded 2026-11): EDA + wrangling deps.
             "babynames", "nycflights13", "jtools", "DT", "FactoMineR",
             "factoextra", "corrplot", "viridis", "huxtable", "umap",
             "ggcorrplot"
           ))
           install.packages(c("naniar", "skimr"))
           remotes::install_github("tractoverse/mascot")
           remotes::install_github("tractoverse/rtists")
           remotes::install_github("tdaverse/ggtda")
        shell: Rscript {0}

      - name: Cache Quarto _freeze
        # Freeze cache keyed NOT on content: a content-hash key (the old
        # `hashFiles('**/*.qmd','**/*.Rmd')`) busted on every real push, so the
        # whole _freeze/ was discarded and freeze never helped incremental
        # renders. Instead, the primary key varies per push (github.sha) so the
        # cache always saves fresh, while the stable `freeze-<os>-` restore-key
        # prefix always pulls back the previous _freeze/. Quarto's freeze: auto
        # then reuses per-document outputs for unchanged .qmd/.Rmd and
        # re-executes only the ones that changed — true incremental rendering
        # under CI-true (no committed _freeze/).
        id: cache-freeze
        uses: actions/cache@v4
        with:
          path: _freeze
          key: freeze-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            freeze-${{ runner.os }}-

      - name: Render Quarto site
        # Plain `quarto render` (no `to:` override). Forcing `to: html` earlier
        # made the revealjs slide decks render as plain website article pages
        # on the deployed site (they only work locally). Letting Quarto use each
        # document's own format (revealjs for slides, html for the rest) fixes
        # that; no version pinning needed.
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
