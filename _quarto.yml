# ==============================================================================
# RECONCILED root _quarto.yml for astamm.github.io
# (Phase i: port existing site configs FIRST, then layer the teaching content)
#
# BASE = the personal site as it stands today (astamm.github.io/_quarto.yml):
#   output-dir: docs        (GitHub Pages serves docs/)
#   _brand.yml              (LMJL blue palette + Jura fonts, "public HTML face")
#   website.navbar light    (Home/Projects/publications/Teaching/.../socials)
#   body-header i18n toggle (en <-> fr)
#   site-url, favicon, page-footer
#   format.html.toc
#   NO project.render whitelist -> render-everything
#   NO committed _freeze/     -> CI-true render (opposite of r-ensai)
#
# EXTENDED with the teaching content. The origin r-ensai conventions that DO
# survive: shared _extensions/, resources/, theme/ + the revealjs deck config,
# which since 2026-11 lives in EACH deck's own front matter (a top-level
# format.revealjs key here triggers a Quarto rename bug, see the format: note
# below). r-ensai conventions that DO NOT: output-dir _site/, committed
# _freeze/, project.render whitelist (see RENDER-STRATEGY note below), dark
# navbar, no i18n.
#
# [RENDER-STRATEGY — DECIDED] The personal site renders everything (no
# whitelist; ~40 posts/talks + en/fr i18n). r-ensai used a whitelist to keep the
# RR lab .qmd files from rendering as site pages. Decision: keep
# render-everything and RELOCATE the RR lab .qmd files under session-N/_labs/
# (underscore dirs never render in a Quarto website); they are copied to the
# site verbatim via project.resources below. Base-R labs are plain .R files
# (never rendered) and stay in place. Do NOT introduce a project.render list.
# ==============================================================================

project:
  type: website
  output-dir: docs

  # Copy lab/data sources into the site for students to download (not rendered).
  # RR .qmd labs now live under session-N/_labs/ so render-everything skips them.
  resources:
    - teaching/r-statistical-language/session-1/lab-1-vectors.R
    - teaching/r-statistical-language/session-1/lab-2-dataframes.R
    - teaching/r-statistical-language/session-1/penguins_messy.txt
    - teaching/r-statistical-language/session-2/lab-1-tidyverse.R
    - teaching/r-statistical-language/session-2/lab-2-plotting.R
    - teaching/r-statistical-language/session-2/penguins.csv
    - teaching/r-statistical-language/session-3/lab-1-loops.R
    - teaching/r-statistical-language/session-3/lab-2-matrices.R
    - teaching/r-statistical-language/session-3/lab-3-functions.R
    - teaching/r-statistical-language/session-3/penguins.csv
    - teaching/reproducible-workflows/session-1/_labs/lab-1-first-doc.qmd
    - teaching/reproducible-workflows/session-1/_labs/lab-2-structured-report.qmd
    - teaching/reproducible-workflows/session-2/_labs/lab-1-eda-datagouv.qmd
    - teaching/reproducible-workflows/session-2/_labs/lab-2-portfolio-book.qmd
    - teaching/reproducible-workflows/session-3/_labs/lab-1-versioning.qmd
    - teaching/reproducible-workflows/session-3/_labs/lab-2-publish.qmd
