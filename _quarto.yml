format:
  html:
    toc: true
    # Repairs the nested (depth-2) sidebar session sections that Quarto emits
    # with data-bs-target="#" + empty id="", which makes Bootstrap collapse a
    # silent no-op ("click a session shows a scroll-down submenu"). Applies to
    # all non-revealjs HTML pages (inlined into each page; no copy into docs/).
    include-after-body: resources/sidebar-nested-collapse.html
  # NOTE (2026-11 rebuild): do NOT add a top-level format.revealjs block here.
  # In a website project that also has format.html, a top-level format.revealjs
  # key triggers a Quarto rename bug (os error 2) that strands html output at the
  # repo root instead of moving it into output-dir, blocking publish (reproduced
  # through Quarto 1.11.9 = latest). The shared slidecrafting revealjs config
  # therefore lives in each deck's own front matter: logo (/images/lmjl.jpg, the
  # site image), theme, filters, plugins, include-after-body, dimensions, footer,
  # and the per-deck include-in-header banner, all with deck-relative ../../../ 
  # paths. Keep it that way.

execute:
  freeze: auto

# ---- METADATA (top-level) -----------------------------------------------------
# LMJL is the author's sole affiliation on the personal site: it applies to every
# page here (home, projects, publications, posts, talks). The ENSAI affiliation is
# deliberately NOT global; it is added back for teaching material only via
# teaching/_metadata.yml (which cascades into all teaching subfolders). The
# revealjs logo/filters do NOT leak to html pages because they live in the decks'
# own front matter (format.revealjs).
#
# The AUTHOR (LMJL-only) lives in a root _metadata.yml, NOT here. If it were in
# this project-level _quarto.yml, Quarto would CONCATENATE it with the
# teaching/_metadata.yml author (both named "A. Stamm"), producing a duplicated
# author on deck title slides. Root _metadata.yml + teaching/_metadata.yml:
# Quarto merges them so teaching overrides cleanly (one author each; verified).
affiliations:
  - id: lmjl
    name: Department of Mathematics Jean Leray, UMR CNRS 6629, Nantes, France
    city: Nantes
    country: France
    url: https://www.math.sciences.univ-nantes.fr/
  - id: ensai
    name: Associate Professor, ENSAI, Rennes, France
    url: https://ensai.fr/
