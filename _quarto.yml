format:
  html:
    toc: true
  # NOTE (2026-11 rebuild): do NOT add a top-level format.revealjs block here.
  # In a website project that also has format.html, a top-level format.revealjs
  # key triggers a Quarto rename bug (os error 2) that strands html output at the
  # repo root instead of moving it into output-dir, blocking publish (reproduced
  # through Quarto 1.11.9 = latest). The shared slidecrafting revealjs config
  # therefore lives in each deck's own front matter: logo (/images/lmjl.jpg, the
  # site image), theme, filters, plugins, include-after-body, dimensions, footer,
  # and the per-deck include-in-header banner, all with deck-relative ../../../ 
  # paths. Keep it that way.

execute:
  freeze: auto

# ---- METADATA (top-level) -----------------------------------------------------
# The personal site's author IS A. Stamm under the LMJL affiliation, so leaving
# these top-level is arguably correct for EVERY page here (personal home + decks
